<!DOCTYPE html>
<html>
<head>
    <title>Book Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Book Management System</h1>

    <!-- Add Book -->
    <div class="container">
        <h2>Add Book</h2>

        <input type="text" id="title" placeholder="Book Title">
        <input type="text" id="author" placeholder="Author">
        <input type="text" id="category" placeholder="Category">

        <button onclick="addBook()">Add Book</button>
    </div>

    <!-- Update Book -->
    <div class="container">
        <h2>Update Book</h2>

        <input type="number" id="updateId" placeholder="Book ID">
        <input type="text" id="newTitle" placeholder="New Title">
        <input type="text" id="newAuthor" placeholder="New Author">
        <input type="text" id="newCategory" placeholder="New Category">

        <button onclick="updateBook()">Update Book</button>
    </div>

    <!-- Delete Book -->
    <div class="container">
        <h2>Delete Book</h2>

        <input type="number" id="deleteId" placeholder="Book ID">

        <button onclick="deleteBook()">Delete Book</button>
    </div>

    <!-- All Books -->
    <div class="container">
        <h2>All Books</h2>

        <button onclick="loadBooks()">Refresh Books</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Category</th>
                </tr>
            </thead>

            <tbody id="bookList"></tbody>
        </table>
    </div>

    <script src="script.js"></script>

</body>
</html>
